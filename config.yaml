name: "ZKTeco ADMS Server"
description: "Servidor ADMS para dispositivos ZKTeco. Recibe eventos de asistencia y acceso y los publica en Home Assistant."
version: "1.9.0"
slug: "zkteco_adms"
init: false
hassio_api: true
homeassistant_api: true
arch:
  - aarch64
  - armhf
  - armv7
  - amd64
  - i386
startup: services
boot: auto
ports:
  8083/tcp: 8083
ports_description:
  8083/tcp: "Puerto ADMS para dispositivos ZKTeco"
options:
  ha_token: ""
  adms_port: 8083
  audit_log_path: "/config/audit.log"
  pv_backend_url: ""
  pv_backend_verify_token: ""
  pv_backend_queue_maxsize: 1000
  pv_backend_timeout_seconds: 3
  forward_operlog_enabled: false
  control_endpoint_enabled: false
  control_endpoint_token: ""
schema:
  ha_token: str?
  adms_port: int
  audit_log_path: str?
  pv_backend_url: "str?"
  pv_backend_verify_token: "password?"
  pv_backend_queue_maxsize: "int(10,100000)"
  pv_backend_timeout_seconds: "int(1,30)"
  forward_operlog_enabled: bool
  control_endpoint_enabled: bool
  control_endpoint_token: "password?"
map:
  - addon_config:rw    # monta /config -> /addon_configs/<slug>/ (audit visible desde core-ssh)
